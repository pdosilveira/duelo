name: Testes e GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar pacote inicial (iTunes)
        continue-on-error: true
        run: node tools/build-seed.mjs
      - name: Checar acesso ao banco (somente leitura)
        continue-on-error: true
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" src/config.js)
          KEY=$(sed -n "s/.*SUPABASE_KEY = '\(.*\)'.*/\1/p" src/config.js)
          if [ -n "$URL" ]; then
            curl -sS -f "$URL/rest/v1/votes?select=seq&limit=1" -H "apikey: $KEY" -o /dev/null -w "votes: HTTP %{http_code}\n"
            curl -sS -f "$URL/rest/v1/songs?select=seq&limit=1" -H "apikey: $KEY" -o /dev/null -w "songs: HTTP %{http_code}\n"
          fi
      - name: Versionar arquivos (força o navegador a baixar a versão nova)
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#src=\"src/app.js\"#src=\"src/app.js?v=$V\"#" index.html
          sed -i -E "s#from '(\./[a-z0-9]+\.js)'#from '\1?v=$V'#g" src/*.js
          grep -o 'src/app.js?v=[a-z0-9]*' index.html
          grep -h -o "from '[^']*'" src/app.js | head -3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
